    <header class="app-header">
      <div class="header-container">
        <div class="brand">
          <div class="brand-icon">📦</div>
          <div class="brand-text">
            <h1>Asset Tracking System</h1>
            <div class="sub-title">Role-Based Borrowing & Approval Management</div>
          </div>

        <div class="user-controls">
          <div class="role-selector-wrapper">
            <label class="control-label" for="role-selector">Role</label>

              <option value="Administrator">Administrator</option>
              <option value="Laboratory Staff">Laboratory Staff</option>
              <option value="Requester" selected>Requester</option>
            </select>
          </div>
          <div id="user-role-badge" class="badge role-requester">Loading...</div>

      </div>
